name: Bug report
description: Report a reproducible bug or unexpected behavior.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Report reproducible problems with the project."
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clearly describe the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the steps or commands needed to reproduce the issue.
      placeholder: |
        1. Run ...
        2. Provide ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python version, operating system, and relevant dependencies.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked existing issues for duplicates.
          required: true
